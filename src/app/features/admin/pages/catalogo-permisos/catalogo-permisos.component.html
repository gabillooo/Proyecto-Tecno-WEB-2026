<h1>Gestión del catálogo de permisos</h1>
<button type="button">Nuevo tipo de permiso</button>

<table class="admin-tabla" *ngIf="tiposPermiso$ | async as tipos">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Categoría</th>
      <th>Tarifa</th>
      <th>Plazo</th>
      <th>Activo</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let tipo of tipos">
      <td>{{ tipo.nombre }}</td>
      <td>{{ tipo.categoria }}</td>
      <td>{{ tipo.tarifa | currency:'CLP' }}</td>
      <td>{{ tipo.plazoEstimadoDias }} días</td>
      <td>{{ tipo.activo ? 'Sí' : 'No' }}</td>
      <td><button type="button">Editar</button></td>
    </tr>
  </tbody>
</table>
