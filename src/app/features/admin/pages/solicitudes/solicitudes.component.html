<h1>Solicitudes</h1>

<table class="admin-tabla" *ngIf="solicitudes$ | async as solicitudes">
  <thead>
    <tr>
      <th>Folio</th>
      <th>Ciudadano</th>
      <th>Permiso</th>
      <th>Estado</th>
      <th>Fecha</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let s of solicitudes">
      <td>{{ s.folio }}</td>
      <td>{{ s.solicitanteId }}</td>
      <td>{{ s.tipoPermisoNombre }}</td>
      <td>{{ s.estado }}</td>
      <td>{{ s.fechaActualizacion | date }}</td>
      <td><button type="button" (click)="aprobar(s.id)">Aprobar</button> <button type="button" class="secondary" (click)="rechazar(s.id)">Rechazar</button></td>
    </tr>
  </tbody>
</table>
