<h1>Estadísticas</h1>

<div *ngIf="estadisticas$ | async as stats" class="estadisticas-grid">
  <section>
    <h2>Por estado</h2>
    <ul>
      <li *ngFor="let entry of stats.porEstado | keyvalue">{{ entry.key }}: {{ entry.value }}</li>
    </ul>
  </section>
  <section>
    <h2>Por tipo de permiso</h2>
    <ul>
      <li *ngFor="let entry of stats.porTipo | keyvalue">{{ entry.key }}: {{ entry.value }}</li>
    </ul>
  </section>
</div>
